name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⭐️ Checkout repository
        uses: actions/checkout@v4

      - name: 📬 Set up CNAME
        run: echo "ivy.hk" > CNAME

      - name: 📦 No build needed (static site)
        run: echo "Site files are ready - GitHub Pages will auto-deploy"

      - name: ✅ Confirm deployment setup
        run: |
          echo "🌐 GitHub Pages will deploy from the 'main' branch"
          echo "🔗 Your site: https://warenix.github.io/ivyhk/"
          echo "📁 Root folder ('/') will be published"
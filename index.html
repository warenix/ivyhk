<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>老婆生日快樂 💌 | IVY.HK</title>
<meta name="description" content="接住蛋糕, 就有禮物收。老公整嘅生日小卡片。">
<meta name="theme-color" content="#f7f1e0">
<meta name="color-scheme" content="light">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="image/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="image/heart_192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IVY">

<meta property="og:type" content="website">
<meta property="og:site_name" content="IVY.HK">
<meta property="og:title" content="老婆生日快樂 💌">
<meta property="og:description" content="接住蛋糕, 就有禮物收。">
<meta property="og:image" content="https://ivy.hk/image/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ivy.hk/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="bg" aria-hidden="true">
  <span class="bg__blob bg__blob--1"></span>
  <span class="bg__blob bg__blob--2"></span>
  <span class="bg__blob bg__blob--3"></span>
  <span class="bg__grain"></span>
</div>

<!-- ── STAGE 1 · intro ─────────────────────────────── -->
<section class="stage stage--intro" id="stage-intro">
  <div class="intro">
    <img class="intro__pig" src="image/hamm.png" alt="小豬" width="140" height="140">
    <p class="intro__kicker">12 · 27</p>
    <h1 class="intro__title">老婆生日快樂</h1>
    <p class="intro__hint">接住 5 個蛋糕, 就有驚喜 🍰</p>
    <button class="btn btn--primary" id="startBtn" type="button">開始</button>
  </div>
</section>

<!-- ── STAGE 2 · game ──────────────────────────────── -->
<section class="stage stage--game" id="stage-game" hidden>
  <header class="hud">
    <div class="hud__hearts" id="hearts" role="img" aria-label="進度 0 / 5"></div>
    <div class="hud__side">
      <span class="combo" id="combo" hidden></span>
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="關閉音效">
        <svg class="icon-btn__on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path class="icon-btn__wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-btn__off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M17 9.5l4 5m0-5l-4 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <p class="hud__tip" id="tip">撳一下空中的蛋糕</p>

  <div class="playfield" id="playfield"></div>

  <div class="thrower" aria-hidden="true">
    <img src="image/hamm.png" alt="" width="150" height="150">
  </div>
</section>

<!-- ── STAGE 3 · victory ───────────────────────────── -->
<section class="stage stage--victory" id="stage-victory" hidden>
  <div class="victory">
    <img class="victory__pig" src="image/hamm.png" alt="小豬" width="150" height="150">

    <h2 class="victory__title">夠啦! 全部接住晒 🎂</h2>

    <svg class="victory__heart" viewBox="0 0 32 29.6" aria-hidden="true">
      <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
    </svg>

    <p class="victory__sign">— 老公</p>

    <div class="victory__actions">
      <button class="btn btn--primary" id="replayBtn" type="button">再玩一次</button>
      <button class="btn btn--ghost" id="shareBtn" type="button">分享呢個遊戲 💛</button>
    </div>
  </div>
</section>

<div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

<script src="js/game.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"15d9d79fa6d147a7b96003a0be233831","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>

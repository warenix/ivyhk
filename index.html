    <style>
      @-webkit-keyframes upthenscale {
  0% {
    -webkit-transform: translateY(250px);
            transform: translateY(250px);
  }
  50% {
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  60% {
    height: 100px;
    width: 90px;
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  100% {
    height: 250px;
    width: 100%;
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
}
@keyframes upthenscale {
  0% {
    -webkit-transform: translateY(250px);
            transform: translateY(250px);
  }
  50% {
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  60% {
    height: 100px;
    width: 90px;
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  100% {
    height: 250px;
    width: 100%;
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
}
@-webkit-keyframes scalethendown {
  0% {
    height: 250px;
    width: 100%;
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  50% {
    height: 100px;
    width: 90px;
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  60% {
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  100% {
    -webkit-transform: translateY(250px);
            transform: translateY(250px);
  }
}
@keyframes scalethendown {
  0% {
    height: 250px;
    width: 100%;
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  50% {
    height: 100px;
    width: 90px;
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  60% {
    -webkit-transform: translateY(0);
            transform: translateY(0);
  }
  100% {
    -webkit-transform: translateY(250px);
            transform: translateY(250px);
  }
}
@-webkit-keyframes waitfade {
  0%, 50% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}
@keyframes waitfade {
  0%, 50% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}
@-webkit-keyframes wiggle {
  0% {
    -webkit-transform: translateY(310px) rotate(0);
            transform: translateY(310px) rotate(0);
  }
  25% {
    -webkit-transform: translateY(310px) rotate(2deg);
            transform: translateY(310px) rotate(2deg);
  }
  50% {
    -webkit-transform: translateY(310px) rotate(0deg);
            transform: translateY(310px) rotate(0deg);
  }
  75% {
    -webkit-transform: translateY(310px) rotate(-2deg);
            transform: translateY(310px) rotate(-2deg);
  }
  100% {
    -webkit-transform: translateY(310px) rotate(0);
            transform: translateY(310px) rotate(0);
  }
}
@keyframes wiggle {
  0% {
    -webkit-transform: translateY(310px) rotate(0);
            transform: translateY(310px) rotate(0);
  }
  25% {
    -webkit-transform: translateY(310px) rotate(2deg);
            transform: translateY(310px) rotate(2deg);
  }
  50% {
    -webkit-transform: translateY(310px) rotate(0deg);
            transform: translateY(310px) rotate(0deg);
  }
  75% {
    -webkit-transform: translateY(310px) rotate(-2deg);
            transform: translateY(310px) rotate(-2deg);
  }
  100% {
    -webkit-transform: translateY(310px) rotate(0);
            transform: translateY(310px) rotate(0);
  }
}
.letter {
  margin: 150px auto;
  max-width: 350px;
  height: 375px;
  position: relative;
  overflow: hidden;
  display: block;
}

.letter--open .paper {
  -webkit-animation-name: upthenscale;
          animation-name: upthenscale;
  -webkit-animation-duration: .6s;
          animation-duration: .6s;
  -webkit-animation-fill-mode: forwards;
          animation-fill-mode: forwards;
}

.letter--close .paper {
  -webkit-animation-name: scalethendown;
          animation-name: scalethendown;
  -webkit-animation-duration: .4s;
          animation-duration: .4s;
  -webkit-animation-fill-mode: forwards;
          animation-fill-mode: forwards;
}

.letter--open .paper-content {
  -webkit-animation-name: waitfade;
          animation-name: waitfade;
  -webkit-animation-duration: 1.5s;
          animation-duration: 1.5s;
  -webkit-animation-fill-mode: forwards;
          animation-fill-mode: forwards;
}

.letter--open .envelope {
  -webkit-animation: pause;
          animation: pause;
}

.paper-content {
  color: #545454;
  /* font-family: 'Roboto', sans-serif; */
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 700;
  padding: 25px;
  opacity: 0;
}

.paper {
  height: 50px;
  width: 90px;
  background: #f1f0c3;
  -webkit-transform: translateY(250px);
          transform: translateY(250px);
  margin: 0 auto;
  -webkit-transition: -webkit-transform 0.3s 0.1s ease;
  transition: -webkit-transform 0.3s 0.1s ease;
  transition: transform 0.3s 0.1s ease;
  transition: transform 0.3s 0.1s ease, -webkit-transform 0.3s 0.1s ease;
  border-radius: 2px;
  position: relative;
}

.envelope {
  width: 94px;
  height: 60px;
  background: #f36363;
  position: relative;
  margin: auto;
  z-index: 2;
  cursor: pointer;
  border-radius: 3px;
  -webkit-transition: box-shadow 0.3s ease;
  transition: box-shadow 0.3s ease;
  -webkit-transform: translateY(310px);
          transform: translateY(310px);
  -webkit-animation: wiggle 0.3s 0.2s infinite;
          animation: wiggle 0.3s 0.2s infinite;
}
.envelope:hover {
  -webkit-animation: pause;
          animation: pause;
}
.envelope:hover .envelope-paper {
  -webkit-transform: translateY(-20px);
          transform: translateY(-20px);
}
.envelope:hover .envelope-flap {
  -webkit-transform: translateY(-45px);
          transform: translateY(-45px);
}
.envelope:hover .envelope-detail::after {
  visibility: hidden;
}

.envelope-paper {
  height: 50px;
  width: 90px;
  background: #f1f0c3;
  -webkit-transform: translateY(0);
          transform: translateY(0);
  margin: 0 auto;
  -webkit-transition: -webkit-transform 0.3s 0.1s ease;
  transition: -webkit-transform 0.3s 0.1s ease;
  transition: transform 0.3s 0.1s ease;
  transition: transform 0.3s 0.1s ease, -webkit-transform 0.3s 0.1s ease;
  border-radius: 2px;
  position: absolute;
  border: 2px solid transparent;
}

.letter--open .envelope-paper {
  visibility: hidden;
}

.letter--open .envelope-detail::after {
  visibility: hidden;
}

.letter--close .envelope-paper {
  visibility: hidden;
}

.envelope-flap {
  content: '';
  width: 0;
  height: 0;
  border-left: 45px solid transparent;
  border-right: 45px solid transparent;
  border-bottom: 45px solid #f36363;
  display: block;
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  margin: auto;
  -webkit-transform: translateY(0);
          transform: translateY(0);
}

.letter--open .envelope-flap {
  -webkit-transform: translateY(-45px);
          transform: translateY(-45px);
}

.letter--open .envelope-detail {
  border-top: 2px solid #e25b5b;
}

.envelope-detail {
  overflow: hidden;
  height: 100%;
  width: 100%;
  display: block;
  position: absolute;
  background: #f36363;
  border-top: 2px solid transparent;
}
.envelope-detail:before {
  content: '';
  width: 70px;
  height: 70px;
  background: #f36363;
  display: inline-block;
  display: block;
  position: absolute;
  left: 0;
  right: 0;
  top: 30px;
  margin: auto;
  -webkit-transform: rotate(45deg);
          transform: rotate(45deg);
  border: 4px solid #e65454;
}
.envelope-detail:after {
  content: '';
  width: 70px;
  height: 70px;
  background: #f36363;
  display: block;
  position: absolute;
  left: 0;
  right: 0;
  top: -45px;
  margin: auto;
  -webkit-transform: rotate(45deg);
          transform: rotate(45deg);
  border: 4px solid #e65454;
}

.envelope__fold {
  height: 25px;
  width: 86px;
  background: #f36363;
  border: 4px solid #e65454;
  display: block;
  position: absolute;
  bottom: 30px;
  left: 0;
  right: 0;
  margin: auto;
  -webkit-transition: all 0.3s ease;
  transition: all 0.3s ease;
  border-radius: 3px;
}

.paper-close {
  position: absolute;
  right: 10px;
  top: 5px;
  display: inline-block;
  cursor: pointer;
}

.message-footer {
  float:right;
}
.heart {
  fill: red;
  position: relative;
  top: 5px;
  width: 2em;
  animation: pulse 1s ease infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
    </style>

    <script>
      document.querySelector('.envelope').addEventListener('click', function(){
      if (document.querySelector('.letter').classList.contains('letter--open')){
        document.querySelector('.letter').classList.remove('letter--open');
        document.querySelector('.letter').classList.add('letter--close');
        setTimeout(function(){
          document.querySelector('.letter').classList.remove('letter--close');
        }, 600);    
      } else {
        document.querySelector('.letter').classList.remove('letter--close');
        document.querySelector('.letter').classList.add('letter--open');
      }
    });

    document.querySelector('.paper-close').addEventListener('click', function(){   document.querySelector('.letter').classList.remove('letter--open');
      document.querySelector('.letter').classList.add('letter--close');
      setTimeout(function(){
        document.querySelector('.letter').classList.remove('letter--close');
      }, 600);
    });
</script>
